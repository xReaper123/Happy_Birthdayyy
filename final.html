<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Rachel's Valley | Heart Event</title>


    <link rel="stylesheet" href="final.css">


    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">


</head>



<body>


<!-- Opening Transition -->

<div id="screen-fade"></div>





<!-- Main Forest Scene -->

<div class="valley-scene">






    <!-- Intro Story -->

    <div id="intro-text">


        After searching through the forest...


        <br><br>


        The Junimos found a lost letter ...



    </div>







    <!-- ==========================
         Mailbox Event
         ========================== -->


    <div id="mailbox-area">



        <div class="sparkles">

            ✨

        </div>



        <div class="sparkles sparkle-two">

            ✨

        </div>





        <img

        id="mailbox"

        src="assets/mailbox.png"

        alt="Mailbox">





        <!-- Mailbox Flag -->

        <div id="mail-flag"></div>






        <p>

            📬 A letter has arrived...

        </p>




    </div>









    <!-- ==========================
         Birthday Letter
         ========================== -->


    <div id="letter-box">


        <div class="letter-paper">



            <h2>

                Dear Rachel,

            </h2>





            <p id="letter-text"></p>




        </div>



    </div>









    <!-- ==========================
         Rachel Appearance
         ========================== -->


    <div id="rachel-area">





        <img

        id="rachel-final"

        src="assets/alfy.gif"

        alt="Rachel">






        <div class="speech">


            <p id="rachel-message"></p>



        </div>





    </div>









    <!-- ==========================
         Final Ending
         ========================== -->


    <div id="ending">



        <h1>

            🌸 Rachel's Valley 🌸

        </h1>




        <p>

            Created with love, happy birthday Rachel! ❤️

        </p>




        <p>

            July 29, 2026

        </p>




    </div>







</div>









<!-- ==========================
     Audio
     ========================== -->


<audio

id="finalMusic"

src="assets/final-music.mp3"

loop

preload="auto">

</audio>





<audio

id="textSound"

src="assets/text.wav">

</audio>









<script src="final.js"></script>



</body>



</html>
