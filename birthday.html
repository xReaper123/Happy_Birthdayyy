<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Rachel's Valley - Summer 29</title>


    <link rel="stylesheet" href="birthday.css">


    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">


</head>

<body>

<div id="page-transition"></div>

<!-- =====================================
     NEW DAY TRANSITION
===================================== -->


<div id="day-transition">


    <div class="day-card">


        ☀️ Summer 29


        <br><br>


        Year 1


        <br><br>


        <span>
            A new day begins...
        </span>


    </div>


</div>





<!-- =====================================
     BIRTHDAY SCREEN
===================================== -->


<section id="birthday-screen">


    <div class="overlay"></div>




    <!-- Music Button -->


    <button id="music-toggle">

        🎵

    </button>





    <!-- Weather -->


    <div class="weather-box">


        ☀️ Weather


        <br>


        <span>

            Sunny Day

        </span>


    </div>







    <div class="morning-content">





        <h1>

            Good Morning, Rachel 🌻

        </h1>





        <p class="subtitle">

            Today feels like a very special day...

        </p>






        <div class="character">


            <img 
            src="assets/rachel-character.gif"
            alt="Rachel">


        </div>







        <div class="message-box">


            <p>


            You wake up to the sound of birds singing...


            <br><br>


            The valley feels warmer today.


            <br><br>


            Something wonderful is waiting for you.


            </p>


        </div>








        <button id="continue-button">


            Continue 🌱


        </button>




    </div>




</section>





<!-- =====================================
     AUDIO
===================================== -->


<audio id="morning-music" loop>

    <source src="assets/morning.mp3" type="audio/mpeg">

</audio>



<audio id="hover-sound">

    <source src="assets/button-hover.mp3" type="audio/mpeg">

</audio>



<audio id="click-sound">

    <source src="assets/button-click.mp3" type="audio/mpeg">

</audio>





<script src="birthday.js"></script>



</body>


</html>
